# Playmate 配置文件示例
#
# 使用方法：复制本文件为运行目录下的 playmate.toml 并按需修改。
# 没有 playmate.toml 时程序使用与本文件相同的内置默认值。
#
# 键名使用 winit KeyCode 变体名（区分大小写），常用值：
#   字母键:   "KeyA" ~ "KeyZ"
#   方向键:   "ArrowUp" / "ArrowDown" / "ArrowLeft" / "ArrowRight"
#   小键盘:   "Numpad0" ~ "Numpad9" / "NumpadDecimal" / "NumpadEnter"
#   修饰键:   "ShiftLeft" / "ShiftRight" / "ControlLeft" / "AltLeft"
#   其他:     "Enter" / "Space" / "Tab" / "Backspace"
# 完整列表: https://docs.rs/winit/0.30/winit/keyboard/enum.KeyCode.html
#
# 注意：
# - Escape 是保留键（退出程序），请勿绑定。
# - 某玩家的段（[keys.p1] / [keys.p2]）一旦写出，该玩家所有键
#   完全以段内内容为准，段内省略的键视为"不绑定"。
# - turbo_a / turbo_b 为连发键：按住时对应按键约每秒自动连点 15 次。
# - 手柄即插即用无需配置：按先后顺序分配给 P1、P2；
#   十字键/左摇杆=方向，南键(A)=B、东键(B)=A，西键(X)=连发B、北键(Y)=连发A，
#   Back=Select，Menu=Start，Mode(Xbox 徽标/PS 键)=呼出暂停菜单。

[keys.p1]
up = "KeyW"
down = "KeyS"
left = "KeyA"
right = "KeyD"
b = "KeyJ"
a = "KeyK"
select = "ShiftLeft"
start = "Enter"
turbo_b = "KeyU"
turbo_a = "KeyI"

[keys.p2]
up = "ArrowUp"
down = "ArrowDown"
left = "ArrowLeft"
right = "ArrowRight"
b = "Numpad0"
a = "NumpadDecimal"
start = "NumpadEnter"
turbo_b = "Numpad1"
turbo_a = "Numpad2"
# P2 默认不绑定 select（真机 2P 手柄没有 Select 键），需要时取消注释：
# select = "NumpadSubtract"

# 画面（设置页可视化管理）：
# [video]
# ntsc_filter = true    # NTSC 柔化滤镜（CRT 观感，默认开）；false = 锐利点阵

# 输入行为（设置页可视化管理）：
# [input]
# hold_turbo_a = false  # 长按 A 连发：按住普通 A 键即以连发节奏自动连点（默认关）。
# hold_turbo_b = false  # 长按 B 连发：同上，作用于 B 键。
#                       # 需要长按的键请勿开启：如《超级马力欧》B 跑步、《魂斗罗》A 跳跃。

# 作弊码（Game Genie 金手指码，按游戏名分组；游戏内暂停菜单可视化管理）：
# 码为 6 或 8 位字母，与 ROM 版本（美版/日版）相关。
# [[cheats."Super Mario Bros"]]
# code = "SXIOPO"     # 无限命
# enabled = true
